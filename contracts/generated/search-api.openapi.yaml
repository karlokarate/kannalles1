info:
  description: Kanonischer Vertrag des versionierten Daten-Gateways. Die statische PWA bleibt für manuelle und lokale Funktionen ohne Gateway nutzbar; globale Suche läuft ausschließlich über diese API.
  title: KH Checker data gateway API
  version: 2.2.4
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
openapi: 3.1.0
paths:
  /api/v1/ai/parse:
    post:
      operationId: parseFoodRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiParseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiParseResponse"
          description: Strukturiertes Parser-Ergebnis
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Ungültige Anfrage
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: JSON-Request überschreitet das Gateway-Größenlimit
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Upstream- oder Parser-Limit. Retry-After ist nur ein Hinweis.
          headers:
            Retry-After:
              description: Delta-Sekunden oder HTTP-Datum
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unerwarteter interner Gateway-Fehler
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Ungültige oder fehlgeschlagene Upstream-Antwort
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Optionaler Dienst vorübergehend nicht verfügbar
          headers:
            Retry-After:
              description: Delta-Sekunden oder HTTP-Datum
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Die absolute Gateway-Deadline wurde überschritten
      summary: Mehrdeutige Nutzereingabe optional strukturieren
      tags:
        - ai
  /api/v1/health:
    get:
      operationId: gatewayHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Gateway ist bereit oder kontrolliert degradiert
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Gateway-Prozess lebt, ist aber nicht bereit
      summary: Status und Capabilities des Daten-Gateways lesen
      tags:
        - health
  /api/v1/product/{code}:
    get:
      operationId: productByBarcode
      parameters:
        - in: path
          name: code
          required: true
          schema:
            example: "1234567"
            pattern: ^\d{7,14}$
            type: string
        - in: query
          name: known_carbs
          required: false
          schema:
            default: "0"
            enum:
              - "0"
              - "1"
            example: "1"
            type: string
        - in: query
          name: product_api
          required: false
          schema:
            $ref: "#/components/schemas/ProductApiMode"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductGatewayResponse"
          description: Ausgewähltes Produkt
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Ungültige Anfrage
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Kein Produkt für diesen Barcode
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: JSON-Request überschreitet das Gateway-Größenlimit
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Upstream- oder Parser-Limit. Retry-After ist nur ein Hinweis.
          headers:
            Retry-After:
              description: Delta-Sekunden oder HTTP-Datum
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unerwarteter interner Gateway-Fehler
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Ungültige oder fehlgeschlagene Upstream-Antwort
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Optionaler Dienst vorübergehend nicht verfügbar
          headers:
            Retry-After:
              description: Delta-Sekunden oder HTTP-Datum
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Die absolute Gateway-Deadline wurde überschritten
      summary: Nur das ausgewählte Produkt hydratisieren
      tags:
        - product
  /api/v1/search:
    get:
      operationId: searchProducts
      parameters:
        - in: query
          name: q
          required: true
          schema:
            example: BiFi
            maxLength: 120
            minLength: 1
            pattern: \S
            type: string
        - in: query
          name: page_size
          required: false
          schema:
            default: 15
            example: 15
            maximum: 20
            minimum: 1
            type: integer
        - description: auto nutzt den eigenen Index primär und OFF Legacy nur als Reserve.
          in: query
          name: search_api
          required: false
          schema:
            $ref: "#/components/schemas/SearchApiMode"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchGatewayResponse"
          description: Suche abgeschlossen; auch null Treffer sind HTTP 200
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Ungültige Anfrage
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: JSON-Request überschreitet das Gateway-Größenlimit
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Upstream- oder Parser-Limit. Retry-After ist nur ein Hinweis.
          headers:
            Retry-After:
              description: Delta-Sekunden oder HTTP-Datum
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unerwarteter interner Gateway-Fehler
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Ungültige oder fehlgeschlagene Upstream-Antwort
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Optionaler Dienst vorübergehend nicht verfügbar
          headers:
            Retry-After:
              description: Delta-Sekunden oder HTTP-Datum
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Die absolute Gateway-Deadline wurde überschritten
      summary: Produkte über das explizit konfigurierte Gateway suchen
      tags:
        - search
security: []
servers:
  - description: Same-origin optionales Gateway
    url: /
  - description: Beispiel für ein externes HTTPS-Gateway
    url: https://kh-api.example
tags:
  - description: Gateway-Status
    name: health
  - description: Produktsuche
    name: search
  - description: Ausgewählte Produktdetails
    name: product
  - description: Optionaler Sprachparser
    name: ai
webhooks: {}
x-kh-generator:
  appVersion: 2.2.4
  authoritativeSource: contracts/source/search-api.contract.mjs
  browserUpstreamPolicy: gateway-only
  deploymentMode: full-stack
  gatewayApiVersion: "1"
  gatewayOptionalForManualAndOfflineUse: true
  gatewayRequiredForGlobalSearch: true
  gatewayRuntime: node
  legacyCompatibilityAliases:
    /api/ai/parse: /api/v1/ai/parse
    /api/health: /api/v1/health
    /api/product/{code}: /api/v1/product/{code}
    /api/search: /api/v1/search
  localCooldownAllowed: false
  maximumDirectSearchBackendsPerAction: 2
  productHydrationFanOutAllowed: false
  retryAfterAdvisoryOnly: true
  version: 1
