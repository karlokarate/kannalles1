name: kh-checker

services:
  gateway:
    build:
      context: .
      args:
        VITE_DATA_GATEWAY_URL: /
    image: ${KH_GATEWAY_IMAGE:-kh-checker-gateway:local}
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      # Forwarded headers are untrusted unless an operator explicitly enables
      # trust behind a controlled reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Safety state and disposable response data use physically distinct
      # Redis services. Production rejects an identical storage identity.
      REDIS_COORDINATION_URL: redis://redis-coordination:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_FAILURE_MODE: closed
      # Production/Compose must never silently coordinate per process.
      REQUIRE_DISTRIBUTED_COORDINATION: "1"
      ALLOW_SINGLE_INSTANCE_COORDINATION: "0"
      SEARCH_INDEX_URL: ${SEARCH_INDEX_URL:-}
      OFF_USER_AGENT: ${OFF_USER_AGENT:?OFF_USER_AGENT must identify the deployment}
      OFF_CONTACT_EMAIL: ${OFF_CONTACT_EMAIL:?OFF_CONTACT_EMAIL is required}
      # HMACs the trusted client address for per-client budgets. It is a
      # backend-only production secret and must never use a VITE_ prefix.
      GATEWAY_CLIENT_SALT: ${GATEWAY_CLIENT_SALT:?GATEWAY_CLIENT_SALT must contain at least 32 random characters}
      CLIENT_SEARCH_RATE_LIMIT_PER_MINUTE: ${CLIENT_SEARCH_RATE_LIMIT_PER_MINUTE:-6}
      CLIENT_PRODUCT_RATE_LIMIT_PER_MINUTE: ${CLIENT_PRODUCT_RATE_LIMIT_PER_MINUTE:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-512}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      AI_SAFETY_SALT: ${AI_SAFETY_SALT:-}
      AI_PARSE_GLOBAL_RATE_LIMIT_PER_MINUTE: ${AI_PARSE_GLOBAL_RATE_LIMIT_PER_MINUTE:-30}
      AI_PARSE_PER_USER_RATE_LIMIT_PER_MINUTE: ${AI_PARSE_PER_USER_RATE_LIMIT_PER_MINUTE:-6}
      AI_PARSE_GLOBAL_RATE_LIMIT_PER_DAY: ${AI_PARSE_GLOBAL_RATE_LIMIT_PER_DAY:-300}
      AI_PARSE_PER_USER_RATE_LIMIT_PER_DAY: ${AI_PARSE_PER_USER_RATE_LIMIT_PER_DAY:-30}
      BUILD_COMMIT: ${BUILD_COMMIT:-}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
    depends_on:
      redis-coordination:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(async r=>{const h=await r.json();if(r.status!==200||h.ready!==true)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  redis-coordination:
    image: ${REDIS_IMAGE:-redis:8.0.3-alpine@sha256:25c0ae32c6c2301798579f5944af53729766a18eff5660bbef196fc2e6214a9c}
    restart: unless-stopped
    # Limiter/circuit keys are safety state and must never be silently evicted.
    # Once maxmemory is reached, writes fail and the gateway's distributed
    # coordination policy fails closed instead of resetting shared budgets.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_COORDINATION_MAXMEMORY:-64mb}", "--maxmemory-policy", "noeviction"]
    mem_limit: ${REDIS_COORDINATION_CONTAINER_MEMORY_LIMIT:-128m}
    volumes:
      - gateway-coordination-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis-cache:
    image: ${REDIS_IMAGE:-redis:8.0.3-alpine@sha256:25c0ae32c6c2301798579f5944af53729766a18eff5660bbef196fc2e6214a9c}
    restart: unless-stopped
    # Gateway response cache is disposable and may evict least-recently-used
    # keys without resetting coordination budgets or circuit state.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-coordination-redis:
