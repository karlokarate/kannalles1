name: One-off semantic and version gate sync

on:
  push:
    branches: [agent/german-fraction-input-v2-4]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-gate-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/german-fraction-input-v2-4
          fetch-depth: 1
          persist-credentials: true

      - name: Install permanent gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`${label}: source fragment missing`);
            if (text.indexOf(before, first + before.length) >= 0) throw new Error(`${label}: source fragment is not unique`);
            return `${text.slice(0, first)}${after}${text.slice(first + before.length)}`;
          }

          const workflowPath = '.github/workflows/build-deploy-pages.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = replaceOnce(
            workflow,
            `      - name: Validate production catalog, workflow and browser-support contract\n        run: |\n          npm run check:catalog\n          npm run check:workflow\n          npm run check:browser-support\n`,
            `      - name: Validate version, production catalog, workflow and browser-support contracts\n        run: |\n          npm run check:version\n          npm run check:catalog\n          npm run check:workflow\n          npm run check:browser-support\n`,
            'quality version gate'
          );
          workflow = replaceOnce(
            workflow,
            `      - name: Run targeted PWA deploy update tests\n        shell: bash\n        run: |\n          set -o pipefail\n          npm run test:pwa-update 2>&1 | tee pwa-update-test-output.log\n\n      - name: Upload targeted diagnostics on failure\n`,
            `      - name: Run targeted PWA deploy update tests\n        shell: bash\n        run: |\n          set -o pipefail\n          npm run test:pwa-update 2>&1 | tee pwa-update-test-output.log\n\n      - name: Run targeted semantic input tests\n        shell: bash\n        run: |\n          set -o pipefail\n          npm run test:semantic-input 2>&1 | tee semantic-input-test-output.log\n\n      - name: Upload targeted diagnostics on failure\n`,
            'semantic unit gate'
          );
          workflow = replaceOnce(
            workflow,
            `            runtime-test-output.log\n            pwa-update-test-output.log\n`,
            `            runtime-test-output.log\n            pwa-update-test-output.log\n            semantic-input-test-output.log\n`,
            'semantic diagnostics'
          );
          workflow = replaceOnce(
            workflow,
            `      - name: Run targeted real unit runtime journeys\n        run: npm run test:e2e:runtime\n\n      - name: Run complete real browser catalog proof\n`,
            `      - name: Run targeted real unit runtime journeys\n        run: npm run test:e2e:runtime\n\n      - name: Run targeted natural-language quantity journeys\n        run: npm run test:e2e:semantic-input\n\n      - name: Run complete real browser catalog proof\n`,
            'semantic browser gate'
          );
          fs.writeFileSync(workflowPath, workflow);

          const validatorPath = 'scripts/validate-workflow.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          validator = replaceOnce(
            validator,
            `const runtime = specs.get('catalog-unit-runtime.spec.ts');\nconst pwaUpdate = specs.get('pwa-update.spec.ts');\n`,
            `const runtime = specs.get('catalog-unit-runtime.spec.ts');\nconst naturalLanguage = specs.get('natural-language-quantities.spec.ts');\nconst pwaUpdate = specs.get('pwa-update.spec.ts');\n`,
            'semantic sentinel declaration'
          );
          validator = replaceOnce(
            validator,
            `if (!matrix || !quality || !catalog || !runtime || !pwaUpdate || !harness || !pwaUpdateConfig || !pwaUpdateServer) {\n`,
            `if (!matrix || !quality || !catalog || !runtime || !naturalLanguage || !pwaUpdate || !harness || !pwaUpdateConfig || !pwaUpdateServer) {\n`,
            'semantic sentinel requirement'
          );
          validator = replaceOnce(
            validator,
            `  ]) requireText(runtime, fragment, 'Unit-Runtime-E2E-Coverage');\n  for (const fragment of [\n    "const OLD_BUILD = 'pwa-old'",\n`,
            `  ]) requireText(runtime, fragment, 'Unit-Runtime-E2E-Coverage');\n  for (const fragment of [\n    'Ein halbes Brötchen',\n    'data-amount',\n    '0.5 * unitWeightG',\n    '½ Brötchen',\n    'null komma fünf Brötchen'\n  ]) requireText(naturalLanguage, fragment, 'Natural-Language-Quantity-E2E-Coverage');\n  for (const fragment of [\n    "const OLD_BUILD = 'pwa-old'",\n`,
            'semantic E2E coverage'
          );
          validator = replaceOnce(
            validator,
            `  const pwaUpdateTests = String(packageJson.scripts?.['test:pwa-update'] ?? '');\n  const pwaUpdateE2e = String(packageJson.scripts?.['test:e2e:pwa-update'] ?? '');\n`,
            `  const pwaUpdateTests = String(packageJson.scripts?.['test:pwa-update'] ?? '');\n  const pwaUpdateE2e = String(packageJson.scripts?.['test:e2e:pwa-update'] ?? '');\n  const semanticInputTests = String(packageJson.scripts?.['test:semantic-input'] ?? '');\n  const semanticInputE2e = String(packageJson.scripts?.['test:e2e:semantic-input'] ?? '');\n`,
            'semantic package scripts'
          );
          validator = replaceOnce(
            validator,
            `  requireText(pwaUpdateE2e, 'scripts/run-pwa-update-e2e.mjs', 'Realer PWA-Update-Test');\n\n  const evidence = validateEvidence();\n`,
            `  requireText(pwaUpdateE2e, 'scripts/run-pwa-update-e2e.mjs', 'Realer PWA-Update-Test');\n  for (const fragment of [\n    'src/lib/input/germanQuantity.test.ts',\n    'src/app/queryParser.fractions.test.ts',\n    'src/session.test.ts'\n  ]) requireText(semanticInputTests, fragment, 'Gezielte semantische Eingabetests');\n  for (const fragment of [\n    'e2e/natural-language-quantities.spec.ts',\n    '--project=chromium-desktop'\n  ]) requireText(semanticInputE2e, fragment, 'Gezielte semantische Browsertests');\n\n  const evidence = validateEvidence();\n`,
            'semantic script validation'
          );
          validator = replaceOnce(
            validator,
            `  'npm run check:catalog', 'npm run check:workflow', 'npm run check:browser-support', 'npm run typecheck',\n  'npm run lint', 'npm run test:runtime', 'npm run test:pwa-update', 'npm test',\n`,
            `  'npm run check:version', 'npm run check:catalog', 'npm run check:workflow', 'npm run check:browser-support', 'npm run typecheck',\n  'npm run lint', 'npm run test:runtime', 'npm run test:pwa-update', 'npm run test:semantic-input', 'npm test',\n`,
            'quality command contract'
          );
          validator = replaceOnce(
            validator,
            `  'npm run test:e2e:install', 'npm run test:e2e:pwa-update', 'npm run test:e2e:runtime', 'npm run test:e2e']) {\n`,
            `  'npm run test:e2e:install', 'npm run test:e2e:pwa-update', 'npm run test:e2e:runtime',\n  'npm run test:e2e:semantic-input', 'npm run test:e2e']) {\n`,
            'browser command contract'
          );
          fs.writeFileSync(validatorPath, validator);
          NODE

      - name: Remove one-off workflow and commit permanent gates
        run: |
          rm .github/workflows/one-off-semantic-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-deploy-pages.yml scripts/validate-workflow.mjs .github/workflows/one-off-semantic-gates.yml
          git commit -m "Require version and semantic input release gates [semantic-gate-sync]"
          git push origin HEAD:agent/german-fraction-input-v2-4
