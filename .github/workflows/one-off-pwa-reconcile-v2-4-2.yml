name: One-off PWA reconciliation release sync

on:
  push:
    branches: [agent/pwa-update-reconciliation-v2-4-2]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[pwa-reconcile-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/pwa-update-reconciliation-v2-4-2
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize patch release and permanent gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`${label}: source fragment missing`);
            if (text.indexOf(before, first + before.length) >= 0) throw new Error(`${label}: source fragment is not unique`);
            return `${text.slice(0, first)}${after}${text.slice(first + before.length)}`;
          }

          const version = '2.4.2';
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          let readme = fs.readFileSync('README.md', 'utf8')
            .replace(/^# FishIT KH Checker v[^\n]+/u, `# FishIT KH Checker v${version}`);
          const bullet = '- build-verifizierte PWA-Updates: ein netzwerkfrischer aktueller Build zeigt kein falsches Update, ein tatsächlich veralteter Homescreen-Build kann nach Zustimmung Cache und App-Shell ersetzen';
          if (!readme.includes(bullet)) {
            readme = readme.replace(
              '- erkannte Mengen bleiben als eine zentrale Request-Quelle bei Favoritenpriorisierung, Produktvarianten und persönlicher Kalibrierung erhalten',
              `- erkannte Mengen bleiben als eine zentrale Request-Quelle bei Favoritenpriorisierung, Produktvarianten und persönlicher Kalibrierung erhalten\n${bullet}`
            );
          }
          fs.writeFileSync('README.md', readme);

          fs.writeFileSync(
            'README-ERST-LESEN.txt',
            fs.readFileSync('README-ERST-LESEN.txt', 'utf8')
              .replace(/^FishIT KH CHECKER v[^\n]+/u, `FishIT KH CHECKER v${version}`)
          );

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = '## 2.4.2 – Build-verifizierte PWA-Aktualisierung';
          if (!changelog.includes(heading)) {
            changelog = changelog.replace('# Changelog\n', `# Changelog\n\n${heading}\n\n- ein wartender Service Worker wird nicht mehr ohne Buildvergleich als Update ausgegeben,\n- nach gelöschtem Cache wird ein bereits netzwerkfrisch geladener aktueller Build still mit seinem Offline-Cache synchronisiert,\n- eine tatsächlich veraltete Homescreen-App erhält erst nach verifiziertem Deploy- und Worker-Abgleich einen Updatehinweis,\n- „Jetzt aktualisieren“ aktiviert den exakt verifizierten wartenden Worker, lädt den neuen Build und lässt Workbox den alten Precache entfernen,\n- ein älterer wartender Worker wird nicht aktiviert, während ein noch neuerer Build installiert wird,\n- reale Zwei-Deploy-Browsertests decken sowohl den falschen Erststart-Hinweis als auch den echten Cache-Updatepfad ab.\n`);
          }
          fs.writeFileSync('CHANGELOG.md', changelog);

          fs.writeFileSync('RELEASE-NOTES-v2.4.2.txt', `FishIT KH Checker v2.4.2\n============================\n\nBEHOBEN\n-------\n- Nach dem Löschen des App-Caches erscheint beim ersten netzwerkfrischen Start kein falscher Updatehinweis mehr.\n- Ein wartender Service Worker gilt erst nach erfolgreichem Vergleich mit app-update.json als echte neue Version.\n- Ist die geöffnete App bereits der aktuelle Deploy, wird nur der Offline-Cache still synchronisiert.\n- Ist die Homescreen-App wirklich veraltet, kann der Benutzer das verifizierte Update aktivieren; der neue Service Worker übernimmt und der alte Precache wird entfernt.\n- Der Updatebutton bleibt ausschließlich für einen vollständig vorbereiteten, dem aktuellen Deploy zugeordneten Worker aktiv.\n\nDATENSCHUTZ UND KOMPATIBILITÄT\n-----------------------------\nLokaler Verlauf, Favoriten, eigene Produkte, Fotos, Einstellungen und persönliche Einheitskalibrierungen bleiben bei der Aktualisierung erhalten.\n`);

          const unitTestPath = 'src/lib/pwaUpdate.test.ts';
          let unitTests = fs.readFileSync(unitTestPath, 'utf8');
          unitTests = unitTests.replace(
            `    controller.dismissUpdate();\n    online = false;\n    await controller.checkForUpdates(false);`,
            `    controller.dismissUpdate();\n    online = false;\n    await controller.checkForUpdates(true);`
          );
          fs.writeFileSync(unitTestPath, unitTests);

          const runtimePath = 'src/lib/pwaUpdate.ts';
          let runtime = fs.readFileSync(runtimePath, 'utf8');
          runtime = replaceOnce(
            runtime,
            `      if (bridge.registration.waiting && verifiedWaitingBuildId !== null) {\n        await reconcileWaitingWorker();\n        return;\n      }`,
            `      if (bridge.registration.waiting\n        && verifiedWaitingBuildId !== null\n        && verifiedWaitingBuildId === mutable.remoteBuildId) {\n        await reconcileWaitingWorker();\n        return;\n      }`,
            'catch waiting worker verification'
          );
          fs.writeFileSync(runtimePath, runtime);

          const architecturePath = 'scripts/pwa-update.architecture.test.ts';
          let architecture = fs.readFileSync(architecturePath, 'utf8');
          architecture = replaceOnce(
            architecture,
            `    expect(runtime.indexOf('const installing = bridge.registration.installing'))\n      .toBeLessThan(runtime.indexOf('if (bridge.registration.waiting)'));`,
            `    const updateResultBlock = runtime.slice(\n      runtime.indexOf('Prefer an actually installing worker over an older waiting worker'),\n      runtime.indexOf('pendingWorkerBuildId = null;', runtime.indexOf('Prefer an actually installing worker over an older waiting worker'))\n    );\n    expect(updateResultBlock.indexOf('const installing = bridge.registration.installing'))\n      .toBeLessThan(updateResultBlock.indexOf('if (bridge.registration.waiting)'));`,
            'installing-before-waiting architecture assertion'
          );
          fs.writeFileSync(architecturePath, architecture);

          const validatorPath = 'scripts/validate-workflow.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          validator = replaceOnce(
            validator,
            `    "const OLD_BUILD = 'pwa-old'",\n    "const NEW_BUILD = 'pwa-new'",\n    '/__pwa_test__/activate/new',\n    'data-pwa-update-state',\n    'pwa-update-apply',\n    "localStorage.getItem('kh:pwa-update-e2e')",\n    'updateManifestCached'`,
            `    "const OLD_BUILD = 'pwa-old'",\n    "const NEW_BUILD = 'pwa-new'",\n    'Cache Storage was deleted',\n    "data-pwa-update-state', 'up-to-date'",\n    "data-pwa-update-state', 'update-available'",\n    'pwa-update-apply',\n    "localStorage.getItem('kh:pwa-update-e2e')",\n    'caches.match(url)',\n    'updateManifestCached'`,
            'PWA update E2E contract'
          );
          fs.writeFileSync(validatorPath, validator);
          NODE

      - name: Remove installer and commit synchronized release
        run: |
          rm .github/workflows/one-off-pwa-reconcile-v2-4-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md README-ERST-LESEN.txt CHANGELOG.md RELEASE-NOTES-v2.4.2.txt src/lib/pwaUpdate.ts src/lib/pwaUpdate.test.ts scripts/pwa-update.architecture.test.ts scripts/validate-workflow.mjs .github/workflows/one-off-pwa-reconcile-v2-4-2.yml
          git commit -m "Synchronize build-verified PWA update release v2.4.2 [pwa-reconcile-sync]"
          git push origin HEAD:agent/pwa-update-reconciliation-v2-4-2
