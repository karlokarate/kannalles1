name: Build and deploy KH Checker to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Empty is a supported manual/offline deployment. As soon as a public
      # HTTPS gateway exists, set the repository variable DATA_GATEWAY_URL.
      VITE_DATA_GATEWAY_URL: ${{ vars.DATA_GATEWAY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production PWA
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Deploy KH Checker PWA
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Deployment summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GATEWAY_URL: ${{ vars.DATA_GATEWAY_URL }}
        run: |
          {
            echo "## KH Checker deployed"
            echo
            echo "- URL: ${PAGE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            if [[ -n "${GATEWAY_URL}" ]]; then
              echo "- Mode: full app with ${GATEWAY_URL}"
            else
              echo "- Mode: manual/offline; set DATA_GATEWAY_URL for global search"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
