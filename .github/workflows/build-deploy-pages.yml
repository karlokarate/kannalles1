name: Build and deploy KH Checker to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build offline Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Online product access is intentionally disabled. The application reads
      # exclusively from the deployed SQLite catalog after installation in OPFS.
      VITE_DATA_GATEWAY_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Catalog/runtime/package-lock.json

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install locked SQLite-WASM runtime
        run: npm ci --prefix Catalog/runtime --no-audit --no-fund

      - name: Validate production catalog artifacts
        run: python3 scripts/validate-catalog-artifacts.py

      - name: Build production PWA
        run: npm run build

      - name: Verify offline runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/catalog/kh-checker-dach.sqlite
          test -s dist/catalog/manifest.json
          test -s dist/catalog/catalog-codecs.v1.json
          test -s dist/catalog/catalog-image-keys.v2.json
          test -s dist/vendor/sqlite/index.mjs
          test -s dist/vendor/sqlite/sqlite3.wasm
          test "$(stat -c %s dist/catalog/kh-checker-dach.sqlite)" -eq 25227264
          test "$(sha256sum dist/catalog/kh-checker-dach.sqlite | cut -d' ' -f1)" = "df177ab7545b13b39f40f1c2474adeb1501b19a44a82bf04838b4fd2e819458d"
          if grep -R --line-number --fixed-strings "search.openfoodfacts.org" dist/assets; then
            echo "FEHLER: Online-Produktsuche ist noch im produktiven App-Bundle enthalten."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Deploy KH Checker PWA
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Deployment summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## KH Checker offline catalog deployed"
            echo
            echo "- URL: ${PAGE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Catalog: production-v1 · 317579 products · 25227264 bytes"
            echo "- Product source: deployed SQLite → OPFS → SQLite-WASM worker"
            echo "- Online OFF/Search-a-licious product access: disabled"
          } >> "${GITHUB_STEP_SUMMARY}"
