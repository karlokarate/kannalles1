name: Build, prove and deploy KH Checker to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate hard-cutover architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Catalog/runtime/package-lock.json

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install locked SQLite-WASM runtime
        run: npm ci --prefix Catalog/runtime --no-audit --no-fund

      - name: Validate production catalog, workflow and browser-support contract
        run: |
          npm run check:catalog
          npm run check:workflow
          npm run check:browser-support

      - name: Typecheck and run deterministic tests
        run: |
          npm run typecheck
          npm test

      - name: Enforce architecture and dead-code gates
        run: |
          npm run check:architecture
          npm run check:knip

  build:
    name: Build manifest-derived Pages artifact
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Catalog/runtime/package-lock.json

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install locked SQLite-WASM runtime
        run: npm ci --prefix Catalog/runtime --no-audit --no-fund

      - name: Validate production catalog artifacts
        run: npm run check:catalog

      - name: Build production PWA
        shell: bash
        run: |
          set +e
          npm run build > build-output.log 2>&1
          status=$?
          tail -n 200 build-output.log
          exit "$status"

      - name: Verify manifest-derived Pages artifact
        run: npm run check:pages

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: offline-build-output
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  browser-e2e:
    name: Prove real SQLite-WASM and OPFS journeys
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Catalog/runtime/package-lock.json

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install locked SQLite-WASM runtime
        run: npm ci --prefix Catalog/runtime --no-audit --no-fund

      - name: Install Playwright browser engines
        run: npm run test:e2e:install

      - name: Run real browser catalog proof
        run: npm run test:e2e

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: playwright-catalog-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 5

  deploy:
    name: Deploy KH Checker PWA
    if: github.event_name != 'pull_request'
    needs: [build, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout manifest for deployment summary
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Deployment summary from production manifest
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('Catalog/catalog-manifest.v1.json', 'utf8'));
          const lines = [
            '## KH Checker offline catalog deployed',
            '',
            `- URL: ${process.env.PAGE_URL}`,
            `- Commit: ${process.env.GITHUB_SHA}`,
            `- Catalog: ${manifest.catalogVersion} · ${manifest.database.products} products · ${manifest.database.bytes} bytes`,
            `- Database file: ${manifest.database.file}`,
            `- SQLite SHA-256: ${manifest.database.sha256}`,
            '- Product source: deployed SQLite → A/B OPFS slots → SQLite-WASM worker',
            '- Online OFF/Search-a-licious product access: disabled',
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
