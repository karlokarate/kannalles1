name: One-off personal unit selection migration

on:
  push:
    branches: [agent/personal-default-unit-v2-4-2]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[personal-unit-selection-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/personal-default-unit-v2-4-2
          fetch-depth: 1
          persist-credentials: true

      - name: Wire shared selection authority
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one fragment, found {count}')
              return text.replace(before, after, 1)

          base_path = pathlib.Path('src/app/useCatalogController.ts')
          base = base_path.read_text()
          base = replace_once(
              base,
              "import { parseCatalogQuery, parseProductList } from './queryParser';\n",
              "import { parseCatalogQuery, parseProductList } from './queryParser';\nimport { useCatalogUnitSelection } from './useCatalogUnitSelection';\n",
              'base selection import'
          )
          base = replace_once(
              base,
              "  const [selectedOptionId, setSelectedOptionId] = useState<string | null>(null);\n",
              '',
              'base duplicate state'
          )
          base = replace_once(
              base,
              "  useEffect(() => { setSelectedOptionId((current) => resolution && current && resolution.options.some((o) => o.id === current) ? current : resolution?.selectedOptionId ?? null); }, [resolution]);\n",
              "  const [selectedOptionId, setSelectedOptionId] = useCatalogUnitSelection(\n    product,\n    resolution,\n    request\n  );\n",
              'base selection effect'
          )
          base_path.write_text(base)

          smart_path = pathlib.Path('src/app/useSmartCatalogController.ts')
          smart = smart_path.read_text()
          smart = replace_once(
              smart,
              "import { useCatalogController } from './useCatalogController';\n",
              "import { useCatalogController } from './useCatalogController';\nimport { useCatalogUnitSelection } from './useCatalogUnitSelection';\n",
              'smart selection import'
          )
          smart = replace_once(
              smart,
              "  const [selectedOptionId, setSelectedOptionId] = useState<string | null>(null);\n",
              '',
              'smart duplicate state'
          )
          smart = replace_once(
              smart,
              "  useEffect(() => {\n    setSelectedOptionId((current) => current && resolution?.options.some((option) => option.id === current)\n      ? current\n      : resolution?.selectedOptionId ?? null);\n  }, [resolution]);\n",
              "  const [selectedOptionId, setSelectedOptionId] = useCatalogUnitSelection(\n    base.product,\n    resolution ?? null,\n    base.request\n  );\n",
              'smart selection effect'
          )
          smart_path.write_text(smart)
          PY

      - name: Remove one-off workflow and commit migration
        run: |
          rm .github/workflows/one-off-personal-unit-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/useCatalogController.ts src/app/useSmartCatalogController.ts .github/workflows/one-off-personal-unit-selection.yml
          git commit -m "Use one personal default unit selection authority [personal-unit-selection-sync]"
          git push origin HEAD:agent/personal-default-unit-v2-4-2
