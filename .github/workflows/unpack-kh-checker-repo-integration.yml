name: Unpack KH Checker repo integration

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP file located directly in the repository root"
        required: true
        default: "KH-CHECKER-v2.2.3-REPO-INTEGRATION.zip"
        type: string
      delete_zip_after_unpack:
        description: "Delete the integration ZIP after successful extraction"
        required: true
        default: true
        type: boolean
      commit_message:
        description: "Commit message for the extracted repository files"
        required: true
        default: "chore: install KH Checker v2.2.3 repo integration"
        type: string

permissions:
  contents: write

concurrency:
  group: unpack-kh-checker-repo-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-and-commit:
    name: Validate, unpack and commit integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate ZIP location and archive entries
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [[ -z "$ZIP_NAME" ]]; then
            echo "::error::ZIP name must not be empty."
            exit 1
          fi

          if [[ "$ZIP_NAME" != "$(basename "$ZIP_NAME")" ]]; then
            echo "::error::The ZIP must be located directly in the repository root."
            exit 1
          fi

          if [[ "$ZIP_NAME" != *.zip ]]; then
            echo "::error::The selected file must have the .zip extension."
            exit 1
          fi

          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "::error::ZIP not found in repository root: $ZIP_NAME"
            echo "ZIP files currently available in the repository root:"
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi

          unzip -tq "$ZIP_NAME"

          UNSAFE_ENTRIES="$(
            zipinfo -1 "$ZIP_NAME" |
              grep -E '(^/|(^|/)\.\.(/|$)|\\|(^|/)\.git(/|$))' || true
          )"

          if [[ -n "$UNSAFE_ENTRIES" ]]; then
            echo "::error::Unsafe or forbidden ZIP entries detected:"
            printf '%s\n' "$UNSAFE_ENTRIES"
            exit 1
          fi

      - name: Extract integration into a temporary directory
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/kh-repo-integration"
          mkdir -p "$RUNNER_TEMP/kh-repo-integration"

          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/kh-repo-integration"

          find "$RUNNER_TEMP/kh-repo-integration" -name '.DS_Store' -delete
          rm -rf "$RUNNER_TEMP/kh-repo-integration/__MACOSX"

          if find "$RUNNER_TEMP/kh-repo-integration" -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are not allowed in the integration ZIP."
            find "$RUNNER_TEMP/kh-repo-integration" -type l -print
            exit 1
          fi

          mapfile -t TOP_LEVEL_ENTRIES < <(
            find "$RUNNER_TEMP/kh-repo-integration"               -mindepth 1               -maxdepth 1               -printf '%f\n' |
              sort
          )

          if [[ ${#TOP_LEVEL_ENTRIES[@]} -eq 0 ]]; then
            echo "::error::The integration ZIP is empty."
            exit 1
          fi

          if [[ ${#TOP_LEVEL_ENTRIES[@]} -eq 1 ]] &&
             [[ -d "$RUNNER_TEMP/kh-repo-integration/${TOP_LEVEL_ENTRIES[0]}" ]]; then
            SOURCE_DIR="$RUNNER_TEMP/kh-repo-integration/${TOP_LEVEL_ENTRIES[0]}"
          else
            SOURCE_DIR="$RUNNER_TEMP/kh-repo-integration"
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Files that will be copied into the repository root:"
          find "$SOURCE_DIR" -mindepth 1 -maxdepth 4 -print | sort

      - name: Copy integration files into repository root
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
          DELETE_ZIP: ${{ inputs.delete_zip_after_unpack }}
        run: |
          set -euo pipefail

          rsync -a             --exclude='.git/'             --exclude="$ZIP_NAME"             "$SOURCE_DIR"/ ./

          if [[ "$DELETE_ZIP" == "true" ]]; then
            rm -f -- "$ZIP_NAME"
          fi

          if [[ ! -d .github/workflows ]]; then
            echo "::error::No .github/workflows directory exists after extraction."
            exit 1
          fi

          if [[ ! -f .github/workflows/build-deploy-pages-v2.2.3.yml ]] &&
             [[ ! -f .github/workflows/build-deploy-pages.yml ]]; then
            echo "::warning::No expected KH Checker build/deploy workflow filename was found."
            echo "Detected workflow files:"
            find .github/workflows -maxdepth 1 -type f -print | sort || true
          fi

      - name: Show repository changes
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          if git diff --quiet &&
             [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "::notice::Nothing changed. The integration may already be installed."
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push extracted files
        if: env.HAS_CHANGES == 'true'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Completion summary
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
          DELETE_ZIP: ${{ inputs.delete_zip_after_unpack }}
        run: |
          {
            echo "## KH Checker repository integration"
            echo
            echo "- Branch: `${{ github.ref_name }}`"
            echo "- ZIP: `$ZIP_NAME`"
            echo "- ZIP deleted after extraction: `$DELETE_ZIP`"
            echo "- Changes committed: `${HAS_CHANGES:-false}`"
            echo
            echo "Start the KH Checker build/deploy workflow manually after this workflow succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
