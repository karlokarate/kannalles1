name: One-off candidate SSOT wiring

on:
  push:
    branches: [agent/input-request-ssot-v2-4-1]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-ssot-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/input-request-ssot-v2-4-1
          fetch-depth: 1
          persist-credentials: true

      - name: Centralize candidate selection
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`${label}: source fragment missing`);
            if (text.indexOf(before, first + before.length) >= 0) throw new Error(`${label}: source fragment is not unique`);
            return `${text.slice(0, first)}${after}${text.slice(first + before.length)}`;
          }

          const path = 'src/app/useCatalogController.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = replaceOnce(
            source,
            `  const selectCandidate = (hit: CatalogSearchHit) => {\n    if (!catalogProductEligibility(hit).eligible) {\n      dispatch({ type: 'validation', message: isClinicCatalogProduct(hit) ? 'Für diesen Klinikdatensatz ist ausdrücklich kein berechenbarer KH-Wert hinterlegt.' : 'Dieser Katalogeintrag ist nicht sicher berechenbar.' });\n      return;\n    }\n    setRequest((current) => search.phase === 'idle'\n      ? requestForBareCatalogProduct(hit)\n      : requestForCatalogVariant(current, hit));\n    dispatch({ type: 'resolve', query: search.query || hit.displayName, product: hit });\n  };\n`,
            `  const resolveSearchCandidate = useCallback((\n    hit: CatalogSearchHit,\n    candidates?: readonly CatalogSearchHit[]\n  ) => {\n    if (!catalogProductEligibility(hit).eligible) {\n      dispatch({ type: 'validation', message: isClinicCatalogProduct(hit) ? 'Für diesen Klinikdatensatz ist ausdrücklich kein berechenbarer KH-Wert hinterlegt.' : 'Dieser Katalogeintrag ist nicht sicher berechenbar.' });\n      return;\n    }\n    setRequest((current) => search.phase === 'idle'\n      ? requestForBareCatalogProduct(hit)\n      : requestForCatalogVariant(current, hit));\n    dispatch({\n      type: 'resolve',\n      query: search.query || hit.displayName,\n      product: hit,\n      candidates\n    });\n  }, [search.phase, search.query]);\n  const selectCandidate = useCallback((hit: CatalogSearchHit) => {\n    resolveSearchCandidate(hit);\n  }, [resolveSearchCandidate]);\n`,
            'candidate authority'
          );
          source = replaceOnce(
            source,
            `calculation, selectCandidate, calibrationUnit,`,
            `calculation, selectCandidate, promoteSearchCandidate: resolveSearchCandidate, calibrationUnit,`,
            'controller return'
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Remove installer and commit candidate authority
        run: |
          rm .github/workflows/one-off-candidate-ssot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/useCatalogController.ts .github/workflows/one-off-candidate-ssot.yml
          git commit -m "Centralize candidate selection in request SSOT [candidate-ssot-sync]"
          git push origin HEAD:agent/input-request-ssot-v2-4-1
