name: One-off preserve recognized amount

on:
  push:
    branches: [agent/input-request-ssot]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preserve-input-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/input-request-ssot
          fetch-depth: 1
          persist-credentials: true

      - name: Preserve the current amount when saving calibration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/app/useCatalogController.ts';
          const before = `      setRequest({ amount: 1, unit: calibrationUnit, unitExplicit: false });`;
          const after = `      setRequest((current) => ({ ...current, unit: calibrationUnit, unitExplicit: false }));`;
          const source = fs.readFileSync(path, 'utf8');
          if ((source.match(new RegExp(before.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&'), 'g')) ?? []).length !== 1) {
            throw new Error('Expected exactly one calibration amount reset.');
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Remove one-off workflow and commit patch
        run: |
          rm .github/workflows/one-off-preserve-input-amount.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/useCatalogController.ts .github/workflows/one-off-preserve-input-amount.yml
          git commit -m "Preserve recognized amount after calibration [preserve-input-sync]"
          git push origin HEAD:agent/input-request-ssot
