name: One-off personal unit lint fixes

on:
  push:
    branches: [agent/personal-default-unit-v2-4-2]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[personal-unit-lint-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/personal-default-unit-v2-4-2
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact lint fixes
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one fragment, found {count}')
              return text.replace(before, after, 1)

          controller_path = pathlib.Path('src/app/useCatalogController.ts')
          controller = controller_path.read_text()
          controller = replace_once(
              controller,
              "  }, [settings.clinicMode, settings.searchResultLimit, status.state]);",
              "  }, [settings.clinicMode, settings.searchResultLimit, setSelectedOptionId, status.state]);",
              'executeSearch dependencies'
          )
          controller = replace_once(
              controller,
              "  }, [calibrationCount, calibrationPreview, calibrationUnit, calibrationWeight, product, refreshLocalData]);",
              "  }, [calibrationCount, calibrationPreview, calibrationUnit, calibrationWeight, product, refreshLocalData, setSelectedOptionId]);",
              'calibration dependencies'
          )
          controller_path.write_text(controller)

          quantity_path = pathlib.Path('src/lib/input/germanQuantity.ts')
          quantity = quantity_path.read_text()
          quantity = quantity.replace('[\\/⁄]', '[/⁄]')
          quantity_path.write_text(quantity)

          pwa_path = pathlib.Path('scripts/pwa-update.architecture.test.ts')
          pwa = pwa_path.read_text()
          pwa = replace_once(
              pwa,
              "expect(verifyPages).toContain('Service Worker darf ${excluded} nicht als App-Shell precachen.');",
              "expect(verifyPages).toContain('Service Worker darf $' + '{excluded} nicht als App-Shell precachen.');",
              'template placeholder warning'
          )
          pwa_path.write_text(pwa)
          PY

      - name: Remove one-off workflow and commit fixes
        run: |
          rm .github/workflows/one-off-personal-unit-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/useCatalogController.ts src/lib/input/germanQuantity.ts scripts/pwa-update.architecture.test.ts .github/workflows/one-off-personal-unit-lint.yml
          git commit -m "Fix lint findings exposed by personal unit checks [personal-unit-lint-sync]"
          git push origin HEAD:agent/personal-default-unit-v2-4-2
