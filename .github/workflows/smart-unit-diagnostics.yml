name: Smart unit diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix Catalog/runtime --no-audit --no-fund
      - name: Capture architecture, dead-code and lint diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          npm run check:architecture > diagnostics/architecture.log 2>&1
          architecture_status=$?
          npm run check:knip > diagnostics/knip.log 2>&1
          knip_status=$?
          npm run lint > diagnostics/lint.log 2>&1
          lint_status=$?
          printf 'architecture=%s\nknip=%s\nlint=%s\n' "$architecture_status" "$knip_status" "$lint_status" > diagnostics/status.txt
          cat diagnostics/status.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: smart-unit-diagnostics
          path: diagnostics
          retention-days: 2
