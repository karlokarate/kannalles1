name: Smart unit diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture typecheck and deterministic tests
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          npm run typecheck > diagnostics/typecheck.log 2>&1
          typecheck_status=$?
          npm test > diagnostics/tests.log 2>&1
          tests_status=$?
          printf 'typecheck=%s\ntests=%s\n' "$typecheck_status" "$tests_status" > diagnostics/status.txt
          cat diagnostics/status.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: smart-unit-diagnostics
          path: diagnostics
          retention-days: 2
