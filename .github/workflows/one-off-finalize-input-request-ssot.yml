name: One-off finalize input request SSOT

on:
  push:
    branches: [agent/input-request-ssot]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[input-finalize-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/input-request-ssot
          fetch-depth: 1
          persist-credentials: true

      - name: Finalize code, version metadata and permanent gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, before, after, label) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one source fragment, found ${count}`);
            return text.replace(before, after);
          }

          const controllerPath = 'src/app/useCatalogController.ts';
          let controller = fs.readFileSync(controllerPath, 'utf8');
          controller = replaceOnce(
            controller,
            `      setRequest({ amount: 1, unit: calibrationUnit, unitExplicit: false });`,
            `      setRequest((current) => ({ ...current, unit: calibrationUnit, unitExplicit: false }));`,
            'preserve calibrated amount'
          );
          fs.writeFileSync(controllerPath, controller);

          const version = '2.4.1';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          let readme = fs.readFileSync('README.md', 'utf8')
            .replace(/^# FishIT KH Checker v[^\n]+/u, `# FishIT KH Checker v${version}`);
          const ssotBullet = '- erkannte Mengen bleiben bei Favoriten-Promotion, Produktvarianten, Kalibrierung und Übernahme in die Gesamtrechnung unverändert erhalten';
          if (!readme.includes(ssotBullet)) {
            readme = readme.replace(
              '- natürliche Bruchmengen in Text und Sprache, zum Beispiel `ein halbes Brötchen`, `dreiviertel Brötchen`, `½ Brötchen` oder `null komma fünf Brötchen`',
              `- natürliche Bruchmengen in Text und Sprache, zum Beispiel \`ein halbes Brötchen\`, \`dreiviertel Brötchen\`, \`½ Brötchen\` oder \`null komma fünf Brötchen\`\n${ssotBullet}`
            );
          }
          fs.writeFileSync('README.md', readme);

          fs.writeFileSync(
            'README-ERST-LESEN.txt',
            fs.readFileSync('README-ERST-LESEN.txt', 'utf8')
              .replace(/^FishIT KH CHECKER v[^\n]+/u, `FishIT KH CHECKER v${version}`)
          );

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = '## 2.4.1 – Mengen-SSOT für Suche und Gesamtrechnung';
          if (!changelog.includes(heading)) {
            changelog = changelog.replace('# Changelog\n', `# Changelog\n\n${heading}\n\n- die einmal erkannte Menge und Einheit werden als gemeinsamer Eingabe-Intent durch Suche, Favoriten-Promotion und Produktvarianten geführt,\n- \`24 Salzstangen\` bleibt dadurch Menge 24 und fällt nicht nach Favoritenauswahl auf 1 zurück,\n- Produkt- und Klinikdefaults werden nur noch in einer zentralen Request-Policy bestimmt,\n- Kalibrierungen ändern die erkannte Menge nicht mehr,\n- Mehrprodukteingaben verwenden dieselbe Request-Policy wie Einzelsuchen.\n`);
          }
          fs.writeFileSync('CHANGELOG.md', changelog);

          fs.writeFileSync('RELEASE-NOTES-v2.4.1.txt', `FishIT KH Checker v2.4.1\n============================\n\nBEHOBEN\n-------\n- Erkannte Mengen wie „24 Salzstangen“ bleiben nach Favoriten-Promotion und Produktvarianten erhalten.\n- Die Menge wird unverändert in die Gesamtrechnung übernommen.\n- Kalibrierungen setzen eine erkannte Menge nicht mehr auf 1 zurück.\n- Einzel-, Mehrprodukt-, Favoriten- und Variantenpfade verwenden dieselbe zentrale Input-Request-Policy.\n\nSICHERHEIT\n----------\nExplizite Nutzereinheiten bleiben erhalten. Fehlende Stückgewichte werden weiterhin nicht geraten.\n`);

          const pwaTestPath = 'src/lib/pwaUpdate.test.ts';
          fs.writeFileSync(
            pwaTestPath,
            fs.readFileSync(pwaTestPath, 'utf8').replaceAll("'2.4.0'", "'2.4.1'")
          );

          const workflowPath = '.github/workflows/build-deploy-pages.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = replaceOnce(
            workflow,
            `      - name: Run targeted semantic input tests\n        shell: bash\n        run: |\n          set -o pipefail\n          npm run test:semantic-input 2>&1 | tee semantic-input-test-output.log\n\n      - name: Upload targeted diagnostics on failure\n`,
            `      - name: Run targeted semantic input tests\n        shell: bash\n        run: |\n          set -o pipefail\n          npm run test:semantic-input 2>&1 | tee semantic-input-test-output.log\n\n      - name: Run targeted input request SSOT tests\n        shell: bash\n        run: |\n          set -o pipefail\n          npm run test:input-request 2>&1 | tee input-request-test-output.log\n\n      - name: Upload targeted diagnostics on failure\n`,
            'input request unit workflow gate'
          );
          workflow = replaceOnce(
            workflow,
            `            semantic-input-test-output.log\n`,
            `            semantic-input-test-output.log\n            input-request-test-output.log\n`,
            'input request diagnostic artifact'
          );
          workflow = replaceOnce(
            workflow,
            `      - name: Run targeted natural-language quantity journeys\n        run: npm run test:e2e:semantic-input\n\n      - name: Run complete real browser catalog proof\n`,
            `      - name: Run targeted natural-language quantity journeys\n        run: npm run test:e2e:semantic-input\n\n      - name: Run targeted input request SSOT journeys\n        run: npm run test:e2e:input-request\n\n      - name: Run complete real browser catalog proof\n`,
            'input request browser workflow gate'
          );
          fs.writeFileSync(workflowPath, workflow);

          const validatorPath = 'scripts/validate-workflow.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          validator = replaceOnce(
            validator,
            `const naturalLanguage = specs.get('natural-language-quantities.spec.ts');\nconst pwaUpdate = specs.get('pwa-update.spec.ts');\n`,
            `const naturalLanguage = specs.get('natural-language-quantities.spec.ts');\nconst inputRequest = specs.get('input-request-ssot.spec.ts');\nconst pwaUpdate = specs.get('pwa-update.spec.ts');\n`,
            'input request sentinel declaration'
          );
          validator = replaceOnce(
            validator,
            `if (!matrix || !quality || !catalog || !runtime || !naturalLanguage || !pwaUpdate || !harness || !pwaUpdateConfig || !pwaUpdateServer) {\n`,
            `if (!matrix || !quality || !catalog || !runtime || !naturalLanguage || !inputRequest || !pwaUpdate || !harness || !pwaUpdateConfig || !pwaUpdateServer) {\n`,
            'input request sentinel requirement'
          );
          validator = replaceOnce(
            validator,
            `  ]) requireText(naturalLanguage, fragment, 'Natural-Language-Quantity-E2E-Coverage');\n  for (const fragment of [\n    "const OLD_BUILD = 'pwa-old'",\n`,
            `  ]) requireText(naturalLanguage, fragment, 'Natural-Language-Quantity-E2E-Coverage');\n  for (const fragment of [\n    '24 Salzstangen',\n    'SALT_STICKS_GTIN',\n    'meal-floating-add',\n    'catalog-variant-select',\n    'toHaveValue(\'24\')'\n  ]) requireText(inputRequest, fragment, 'Input-Request-SSOT-E2E-Coverage');\n  for (const fragment of [\n    "const OLD_BUILD = 'pwa-old'",\n`,
            'input request E2E coverage'
          );
          validator = replaceOnce(
            validator,
            `  const semanticInputTests = String(packageJson.scripts?.['test:semantic-input'] ?? '');\n  const semanticInputE2e = String(packageJson.scripts?.['test:e2e:semantic-input'] ?? '');\n`,
            `  const semanticInputTests = String(packageJson.scripts?.['test:semantic-input'] ?? '');\n  const semanticInputE2e = String(packageJson.scripts?.['test:e2e:semantic-input'] ?? '');\n  const inputRequestTests = String(packageJson.scripts?.['test:input-request'] ?? '');\n  const inputRequestE2e = String(packageJson.scripts?.['test:e2e:input-request'] ?? '');\n`,
            'input request scripts declaration'
          );
          validator = replaceOnce(
            validator,
            `  for (const fragment of [\n    'e2e/natural-language-quantities.spec.ts',\n    '--project=chromium-desktop'\n  ]) requireText(semanticInputE2e, fragment, 'Gezielte semantische Browsertests');\n\n  const evidence = validateEvidence();\n`,
            `  for (const fragment of [\n    'e2e/natural-language-quantities.spec.ts',\n    '--project=chromium-desktop'\n  ]) requireText(semanticInputE2e, fragment, 'Gezielte semantische Browsertests');\n  for (const fragment of [\n    'src/app/catalogInputRequest.test.ts',\n    'src/lib/searchState.test.ts',\n    'scripts/catalog-unit-runtime.architecture.test.ts'\n  ]) requireText(inputRequestTests, fragment, 'Gezielte Input-Request-SSOT-Tests');\n  for (const fragment of [\n    'e2e/input-request-ssot.spec.ts',\n    '--project=chromium-desktop'\n  ]) requireText(inputRequestE2e, fragment, 'Gezielte Input-Request-SSOT-Browsertests');\n\n  const evidence = validateEvidence();\n`,
            'input request script validation'
          );
          validator = replaceOnce(
            validator,
            `  'npm run lint', 'npm run test:runtime', 'npm run test:pwa-update', 'npm run test:semantic-input', 'npm test',\n`,
            `  'npm run lint', 'npm run test:runtime', 'npm run test:pwa-update', 'npm run test:semantic-input',\n  'npm run test:input-request', 'npm test',\n`,
            'input request quality command'
          );
          validator = replaceOnce(
            validator,
            `  'npm run test:e2e:semantic-input', 'npm run test:e2e']) {\n`,
            `  'npm run test:e2e:semantic-input', 'npm run test:e2e:input-request', 'npm run test:e2e']) {\n`,
            'input request browser command'
          );
          fs.writeFileSync(validatorPath, validator);
          NODE

      - name: Remove one-off workflow and commit finalization
        run: |
          rm .github/workflows/one-off-finalize-input-request-ssot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/useCatalogController.ts package-lock.json README.md README-ERST-LESEN.txt CHANGELOG.md RELEASE-NOTES-v2.4.1.txt src/lib/pwaUpdate.test.ts .github/workflows/build-deploy-pages.yml scripts/validate-workflow.mjs .github/workflows/one-off-finalize-input-request-ssot.yml
          git commit -m "Finalize v2.4.1 input request SSOT release [input-finalize-sync]"
          git push origin HEAD:agent/input-request-ssot
