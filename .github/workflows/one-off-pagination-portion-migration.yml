name: One-off pagination and portion migration

on:
  push:
    branches: [agent/search-pagination-and-portion-semantics-v2-5]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[pagination-portion-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/search-pagination-and-portion-semantics-v2-5
          fetch-depth: 1
          persist-credentials: true

      - name: Apply SSOT migration
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one fragment, found {count}')
              return text.replace(before, after, 1)

          worker_path = pathlib.Path('src/lib/catalog/catalog.worker.ts')
          worker = worker_path.read_text()
          worker = replace_once(
              worker,
              "import { type CatalogSqlRow, projectCatalogProductRow, projectCatalogSearchRows } from './catalogProjection';\n",
              "import { CATALOG_SEARCH_LOOKAHEAD_SIZE } from './catalogPagination';\nimport { type CatalogSqlRow, projectCatalogProductRow, projectCatalogSearchRows } from './catalogProjection';\n",
              'worker pagination import'
          )
          worker = replace_once(
              worker,
              "  const limit = Math.max(1, Math.min(20, Math.trunc(requestedLimit) || 20));",
              "  const limit = Math.max(1, Math.min(CATALOG_SEARCH_LOOKAHEAD_SIZE, Math.trunc(requestedLimit) || 20));",
              'worker lookahead limit'
          )
          worker_path.write_text(worker)

          controller_path = pathlib.Path('src/app/useCatalogController.ts')
          controller = controller_path.read_text()
          controller = replace_once(
              controller,
              "import { catalogDiagnostics, toCatalogFailure } from '../lib/catalog/catalogErrors';\n",
              "import { catalogDiagnostics, toCatalogFailure } from '../lib/catalog/catalogErrors';\nimport {\n  finishCatalogSearchPage,\n  paginateLocalCatalogResults,\n  planCatalogSearchPage\n} from '../lib/catalog/catalogPagination';\n",
              'controller pagination import'
          )
          controller = replace_once(
              controller,
              "import { parseCatalogQuery, parseProductList } from './queryParser';",
              "import { parseCatalogInputParts, parseCatalogQuery } from './queryParser';",
              'controller input parser import'
          )
          old_search = """    const pageSize = Math.min(20, settings.searchResultLimit);
    const offset = Math.max(0, page) * pageSize;
    const clinicMatches = parsed.barcode || settings.clinicMode === 'off' ? [] : searchClinicCatalog(parsed.catalogQuery, Number.MAX_SAFE_INTEGER);
    const cookedGeneric = parsed.barcode || settings.clinicMode === 'clinic-only' ? null : genericCookedProductForQuery(parsed.catalogQuery);
    if (settings.clinicMode === 'clinic-only') {
      const hits = clinicMatches.slice(offset, offset + pageSize);
      setSearchPage(page); setSearchHasNext(offset + pageSize < clinicMatches.length);
      if (!hits.length) { dispatch({ type: 'not-found', query: parsed.catalogQuery }); return; }
      const flags = hits.map((hit) => catalogProductEligibility(hit).eligible);
      const preferred = selectDefaultCatalogCandidate(hits, parsed.catalogQuery, flags);
      if (preferred) {
        setRequest(requestForInitialCatalogProduct(parsed, preferred));
        dispatch({ type: 'resolve', query: parsed.catalogQuery, product: preferred, candidates: hits });
      } else dispatch({ type: 'show-choice', query: parsed.catalogQuery, candidates: hits });
      return;
    }
"""
          new_search = """    const clinicMatches = parsed.barcode || settings.clinicMode === 'off' ? [] : searchClinicCatalog(parsed.catalogQuery, Number.MAX_SAFE_INTEGER);
    const cookedGeneric = parsed.barcode || settings.clinicMode === 'clinic-only' ? null : genericCookedProductForQuery(parsed.catalogQuery);
    if (settings.clinicMode === 'clinic-only') {
      const resultPage = paginateLocalCatalogResults(clinicMatches, page);
      const hits = resultPage.items.map((hit, index) => ({
        ...hit,
        resultIndex: resultPage.offset + index
      }));
      setSearchPage(resultPage.page);
      setSearchHasNext(resultPage.hasNext);
      if (!hits.length) { dispatch({ type: 'not-found', query: parsed.catalogQuery }); return; }
      const flags = hits.map((hit) => catalogProductEligibility(hit).eligible);
      const preferred = selectDefaultCatalogCandidate(hits, parsed.catalogQuery, flags);
      if (preferred) {
        setRequest(requestForInitialCatalogProduct(parsed, preferred));
        dispatch({ type: 'resolve', query: parsed.catalogQuery, product: preferred, candidates: hits });
      } else dispatch({ type: 'show-choice', query: parsed.catalogQuery, candidates: hits });
      return;
    }
"""
          controller = replace_once(controller, old_search, new_search, 'fixed page search')
          old_hybrid = """      const localMatches = cookedGeneric ? [...clinicMatches, asGenericSearchHit(cookedGeneric)] : clinicMatches;
      const localPage = localMatches.slice(offset, offset + pageSize);
      const remaining = pageSize - localPage.length;
      const sqliteOffset = Math.max(0, offset - localMatches.length);
      const sqliteHits = remaining > 0
        ? await searchOfflineCatalog(parsed.catalogQuery, remaining + 1, controller.signal, sqliteOffset)
        : [];
      const hits = [...localPage, ...sqliteHits.slice(0, remaining)].map((hit, resultIndex) => ({ ...hit, resultIndex }));
      setSearchPage(page);
      setSearchHasNext(offset + localPage.length < localMatches.length || (remaining > 0 && sqliteHits.length >= remaining) || (remaining === 0 && status.state === 'ready'));
"""
          new_hybrid = """      const localMatches = cookedGeneric ? [...clinicMatches, asGenericSearchHit(cookedGeneric)] : clinicMatches;
      const pagePlan = planCatalogSearchPage(localMatches, page);
      const sqliteHits = pagePlan.sourceLimit > 0
        ? await searchOfflineCatalog(
            parsed.catalogQuery,
            pagePlan.sourceLimit,
            controller.signal,
            pagePlan.sourceOffset
          )
        : [];
      const resultPage = finishCatalogSearchPage(pagePlan, sqliteHits);
      const hits = resultPage.items.map((hit, index) => ({
        ...hit,
        resultIndex: resultPage.offset + index
      }));
      setSearchPage(resultPage.page);
      setSearchHasNext(resultPage.hasNext);
"""
          controller = replace_once(controller, old_hybrid, new_hybrid, 'hybrid page plan')
          controller = replace_once(
              controller,
              "  }, [settings.clinicMode, settings.searchResultLimit, setSelectedOptionId, status.state]);",
              "  }, [settings.clinicMode, setSelectedOptionId, status.state]);",
              'remove result limit dependency'
          )
          controller = replace_once(
              controller,
              "    const parts = parseProductList(input);\n    if (parts.length <= 1) { await executeSearch(input); return; }\n    if (status.state !== 'ready' && settings.clinicMode !== 'clinic-only') { await executeSearch(parts[0] ?? input); return; }",
              "    const inputParts = parseCatalogInputParts(input);\n    if (inputParts.length <= 1) { await executeSearch(input); return; }\n    if (status.state !== 'ready' && settings.clinicMode !== 'clinic-only') { await executeSearch(inputParts[0]?.source ?? input); return; }",
              'base compound parser'
          )
          controller = replace_once(
              controller,
              "      for (const part of parts) {\n        const parsed = parseCatalogQuery(part);\n        if (!parsed) { failures.push(part); continue; }",
              "      for (const inputPart of inputParts) {\n        const { source: part, parsed } = inputPart;\n        if (!parsed) { failures.push(part); continue; }",
              'base compound loop'
          )
          controller = replace_once(
              controller,
              "      if (!(error instanceof DOMException && error.name === 'AbortError')) failures.push(...parts.filter((part) => !failures.includes(part)));",
              "      if (!(error instanceof DOMException && error.name === 'AbortError')) failures.push(...inputParts.map((part) => part.source).filter((part) => !failures.includes(part)));",
              'base compound failures'
          )
          controller_path.write_text(controller)

          smart_path = pathlib.Path('src/app/useSmartCatalogController.ts')
          smart = smart_path.read_text()
          smart = replace_once(
              smart,
              "import { parseCatalogQuery, parseProductList } from './queryParser';",
              "import { parseCatalogInputParts } from './queryParser';\nimport type { ParsedCatalogQuery } from './queryParser';",
              'smart parser import'
          )
          smart = replace_once(
              smart,
              "  const resolveInputPart = async (part: string, signal: AbortSignal): Promise<{ item: MealCalculationItem | null; pending: PendingSmartUnitItem | null }> => {\n    const parsed = parseCatalogQuery(part);\n    if (!parsed) return { item: null, pending: null };",
              "  const resolveInputPart = async (parsed: ParsedCatalogQuery, signal: AbortSignal): Promise<{ item: MealCalculationItem | null; pending: PendingSmartUnitItem | null }> => {",
              'smart parsed resolver'
          )
          smart = replace_once(
              smart,
              "    const parts = parseProductList(input);\n    if (parts.length <= 1) {\n      await base.executeSearch(input);\n      return;\n    }\n    if (base.status.state !== 'ready' && base.settings.clinicMode !== 'clinic-only') {\n      await base.executeSearch(parts[0] ?? input);",
              "    const inputParts = parseCatalogInputParts(input);\n    if (inputParts.length <= 1) {\n      await base.executeSearch(input);\n      return;\n    }\n    if (base.status.state !== 'ready' && base.settings.clinicMode !== 'clinic-only') {\n      await base.executeSearch(inputParts[0]?.source ?? input);",
              'smart compound parser'
          )
          smart = replace_once(
              smart,
              "      for (const part of parts) {\n        const result = await resolveInputPart(part, controller.signal);\n        if (result.item) added.push(result.item);\n        else if (result.pending) pending.push(result.pending);\n        else failures.push(part);\n      }",
              "      for (const inputPart of inputParts) {\n        if (!inputPart.parsed) {\n          failures.push(inputPart.source);\n          continue;\n        }\n        const result = await resolveInputPart(inputPart.parsed, controller.signal);\n        if (result.item) added.push(result.item);\n        else if (result.pending) pending.push(result.pending);\n        else failures.push(inputPart.source);\n      }",
              'smart compound loop'
          )
          smart = replace_once(
              smart,
              "      if (!(error instanceof DOMException && error.name === 'AbortError')) failures.push(...parts.filter((part) => !failures.includes(part)));",
              "      if (!(error instanceof DOMException && error.name === 'AbortError')) failures.push(...inputParts.map((part) => part.source).filter((part) => !failures.includes(part)));",
              'smart compound failures'
          )
          smart_path.write_text(smart)

          settings_path = pathlib.Path('src/app/SettingsScreen.tsx')
          settings = settings_path.read_text()
          settings = replace_once(
              settings,
              """          <label className=\"field\">\n            <span>Maximale Suchtreffer</span>\n            <select value={settings.searchResultLimit} onChange={(event: ChangeEvent<HTMLSelectElement>) => update('searchResultLimit', Number(event.target.value) as 10 | 15 | 20)}>\n              <option value={10}>10</option><option value={15}>15</option><option value={20}>20</option>\n            </select>\n          </label>\n""",
              "          <p className=\"settings-note\">Produktsuchen zeigen immer 20 Treffer pro Seite; weitere Treffer bleiben über die Seitennavigation erreichbar.</p>\n",
              'settings pagination copy'
          )
          settings_path.write_text(settings)
          PY

      - name: Remove one-off workflow and commit migration
        run: |
          rm .github/workflows/one-off-pagination-portion-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog/catalog.worker.ts src/app/useCatalogController.ts src/app/useSmartCatalogController.ts src/app/SettingsScreen.tsx .github/workflows/one-off-pagination-portion-migration.yml
          git commit -m "Use twenty-result pages and compound portion semantics [pagination-portion-sync]"
          git push origin HEAD:agent/search-pagination-and-portion-semantics-v2-5
