name: One-off v2.4.1 metadata sync

on:
  push:
    branches: [agent/input-request-ssot-v2-4-1]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v2.4.1-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/input-request-ssot-v2-4-1
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize release metadata and targeted gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = '2.4.1';
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = version;
          pkg.scripts['test:semantic-input'] = 'vitest run src/lib/input/germanQuantity.test.ts src/app/queryParser.fractions.test.ts src/app/catalogInputRequest.test.ts src/session.test.ts scripts/catalog-input-request.architecture.test.ts';
          pkg.scripts['test:e2e:semantic-input'] = 'playwright test e2e/natural-language-quantities.spec.ts e2e/input-request-ssot.spec.ts --project=chromium-desktop';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          let readme = fs.readFileSync('README.md', 'utf8')
            .replace(/^# FishIT KH Checker v[^\n]+/u, `# FishIT KH Checker v${version}`);
          const bullet = '- erkannte Mengen bleiben als eine zentrale Request-Quelle bei Favoritenpriorisierung, Produktvarianten und persönlicher Kalibrierung erhalten';
          if (!readme.includes(bullet)) {
            readme = readme.replace(
              '- natürliche Bruchmengen in Text und Sprache, zum Beispiel `ein halbes Brötchen`, `dreiviertel Brötchen`, `½ Brötchen` oder `null komma fünf Brötchen`',
              `- natürliche Bruchmengen in Text und Sprache, zum Beispiel \`ein halbes Brötchen\`, \`dreiviertel Brötchen\`, \`½ Brötchen\` oder \`null komma fünf Brötchen\`\n${bullet}`
            );
          }
          fs.writeFileSync('README.md', readme);

          fs.writeFileSync(
            'README-ERST-LESEN.txt',
            fs.readFileSync('README-ERST-LESEN.txt', 'utf8')
              .replace(/^FishIT KH CHECKER v[^\n]+/u, `FishIT KH CHECKER v${version}`)
          );

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = '## 2.4.1 – Erkannte Mengen als zentrale Request-Quelle';
          if (!changelog.includes(heading)) {
            changelog = changelog.replace('# Changelog\n', `# Changelog\n\n${heading}\n\n- behebt den Mengenverlust bei asynchroner Favoritenpriorisierung, zum Beispiel \`24 Salzstangen\`,\n- die kanonische Produktabfrage wird nicht mehr erneut als neue Mengeneingabe geparst,\n- initiale Produktdefaults, Mehrprodukteingaben und Variantenwechsel verwenden eine gemeinsame Request-Policy,\n- Produktvarianten und bestätigte Einheitskalibrierungen behalten die erkannte Menge,\n- echte SQLite-WASM-Browsertests reproduzieren den Favoritenfall und prüfen die vollständige Berechnung.\n`);
          }
          fs.writeFileSync('CHANGELOG.md', changelog);

          fs.writeFileSync(
            'src/lib/pwaUpdate.test.ts',
            fs.readFileSync('src/lib/pwaUpdate.test.ts', 'utf8').replaceAll("'2.4.0'", "'2.4.1'")
          );

          fs.writeFileSync('RELEASE-NOTES-v2.4.1.txt', `FishIT KH Checker v2.4.1\n============================\n\nBEHOBEN\n-------\n- Erkannte Mengen wie „24 Salzstangen“ bleiben auch dann erhalten, wenn ein lokal gespeicherter Favorit nachträglich priorisiert wird.\n- Produktvarianten und bestätigte persönliche Einheitskalibrierungen setzen die Menge nicht mehr auf 1 zurück.\n- Die kanonische Produktabfrage wird nicht mehr ein zweites Mal als Mengenquelle geparst.\n\nARCHITEKTUR\n-----------\nEine gemeinsame Request-Policy ist die einzige Autorität für erkannte Menge, Einheit, Produktdefaults und Variantenwechsel.\n\nKOMPATIBILITÄT\n--------------\nVerlauf, Favoriten, eigene Produkte, Fotos, Einstellungen und Kalibrierungen bleiben erhalten.\n`);

          const validatorPath = 'scripts/validate-workflow.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          validator = validator.replace(
            `    'src/app/queryParser.fractions.test.ts',\n    'src/session.test.ts'`,
            `    'src/app/queryParser.fractions.test.ts',\n    'src/app/catalogInputRequest.test.ts',\n    'src/session.test.ts',\n    'scripts/catalog-input-request.architecture.test.ts'`
          );
          validator = validator.replace(
            `    'e2e/natural-language-quantities.spec.ts',\n    '--project=chromium-desktop'`,
            `    'e2e/natural-language-quantities.spec.ts',\n    'e2e/input-request-ssot.spec.ts',\n    '--project=chromium-desktop'`
          );
          fs.writeFileSync(validatorPath, validator);
          NODE

      - name: Remove installer and commit synchronized release
        run: |
          rm .github/workflows/one-off-v2-4-1-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md README-ERST-LESEN.txt CHANGELOG.md RELEASE-NOTES-v2.4.1.txt src/lib/pwaUpdate.test.ts scripts/validate-workflow.mjs .github/workflows/one-off-v2-4-1-sync.yml
          git commit -m "Synchronize request SSOT release v2.4.1 [v2.4.1-sync]"
          git push origin HEAD:agent/input-request-ssot-v2-4-1
