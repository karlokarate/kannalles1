name: Deploy selected KH Checker ZIP to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP path in the repository, for example releases/kh-checker-v2.0-komplett.zip"
        required: true
        default: "releases/kh-checker-v2.0-komplett.zip"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy selected release ZIP
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate selected ZIP
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          case "$ZIP_PATH" in
            releases/*.zip) ;;
            *)
              echo "::error::The selected file must be a ZIP inside releases/."
              exit 1
              ;;
          esac

          if [[ "$ZIP_PATH" == *".."* ]]; then
            echo "::error::The ZIP path must not contain '..'."
            exit 1
          fi

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::Selected ZIP does not exist: $ZIP_PATH"
            echo "Available release ZIP files:"
            find releases -maxdepth 1 -type f -name '*.zip' -print | sort || true
            exit 1
          fi

          unzip -t "$ZIP_PATH"

      - name: Prepare clean deployment directory
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          rm -rf site unpacked
          mkdir -p site unpacked
          unzip -q "$ZIP_PATH" -d unpacked

          if [[ -f unpacked/index.html ]]; then
            SOURCE_DIR="unpacked"
          else
            mapfile -t ROOTS < <(find unpacked -mindepth 2 -maxdepth 2 -type f -name index.html | sort)

            if [[ ${#ROOTS[@]} -ne 1 ]]; then
              echo "::error::The ZIP must contain index.html at ZIP root or inside exactly one top-level folder."
              echo "Detected index.html files:"
              find unpacked -type f -name index.html -print | sort || true
              exit 1
            fi

            SOURCE_DIR="$(dirname "${ROOTS[0]}")"
          fi

          rsync -a --delete "$SOURCE_DIR"/ site/
          touch site/.nojekyll

          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js

          if find site -type f -path '*/.git/*' | grep -q .; then
            echo "::error::The ZIP must not contain a .git directory."
            exit 1
          fi

          if find site -type f -path '*/payload/*' | grep -q .; then
            echo "::error::The ZIP unexpectedly contains a payload directory."
            exit 1
          fi

          echo "Selected release: $ZIP_PATH"
          echo "Deployment root: $SOURCE_DIR"
          echo "Files to publish:"
          find site -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
