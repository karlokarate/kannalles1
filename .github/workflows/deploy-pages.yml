name: Deploy KH Checker to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct static KH Checker app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          find payload -maxdepth 1 -type f -name 'xpart-*' -print0 \
            | sort -z \
            | xargs -0 cat \
            > runtime.b64
          base64 --decode runtime.b64 > runtime.tar.xz
          tar -xJf runtime.tar.xz -C site
          touch site/.nojekyll
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
