name: Deploy selected KH Checker ZIP to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP path in the repository, e.g. releases/kh-checker-v2.1-komplett.zip"
        required: true
        default: "releases/kh-checker-v2.0-komplett.zip"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate selected ZIP
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          case "$ZIP_PATH" in
            releases/*.zip) ;;
            *)
              echo "::error::ZIP_PATH must point to a .zip file inside releases/."
              exit 1
              ;;
          esac

          if [[ "$ZIP_PATH" == *".."* ]]; then
            echo "::error::ZIP_PATH must not contain '..'."
            exit 1
          fi

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::Selected ZIP does not exist: $ZIP_PATH"
            echo "Available ZIP files:"
            find releases -maxdepth 1 -type f -name '*.zip' -print | sort || true
            exit 1
          fi

          unzip -t "$ZIP_PATH"

      - name: Extract selected version into a clean site directory
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          rm -rf site unpacked
          mkdir -p site unpacked
          unzip -q "$ZIP_PATH" -d unpacked

          if [[ -f unpacked/index.html ]]; then
            SOURCE_DIR="unpacked"
          else
            mapfile -t INDEX_FILES < <(find unpacked -mindepth 2 -maxdepth 2 -type f -name index.html | sort)

            if [[ ${#INDEX_FILES[@]} -ne 1 ]]; then
              echo "::error::The ZIP must contain index.html either at ZIP root or inside exactly one top-level folder."
              echo "Found index.html files:"
              find unpacked -type f -name index.html -print | sort || true
              exit 1
            fi

            SOURCE_DIR="$(dirname "${INDEX_FILES[0]}")"
          fi

          rsync -a --delete "$SOURCE_DIR"/ site/
          touch site/.nojekyll

          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js

          if find site -type f -path '*/payload/*' | grep -q .; then
            echo "::error::Unexpected payload directory inside deployable site."
            exit 1
          fi

          echo "Deploying ZIP: $ZIP_PATH"
          echo "Deploying from: $SOURCE_DIR"
          echo "Top-level site contents:"
          find site -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
