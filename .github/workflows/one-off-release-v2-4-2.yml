name: One-off v2.4.2 release metadata sync

on:
  push:
    branches: [agent/release-pwa-fix-v2-4-2]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v2.4.2-release-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/release-pwa-fix-v2-4-2
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = '2.4.2';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8')
            .replace(/^# FishIT KH Checker v[^\n]+/u, `# FishIT KH Checker v${version}`);
          const bullet = '- PWA-Updates werden nur noch nach verifiziertem Deploy-Build angeboten; Netzwerkladen und Cache-Reparatur bleiben ohne falschen Updatehinweis';
          if (!readme.includes(bullet)) {
            const marker = '- erkannte Mengen bleiben als eine zentrale Request-Quelle bei Favoritenpriorisierung, Produktvarianten und persönlicher Kalibrierung erhalten';
            readme = readme.includes(marker)
              ? readme.replace(marker, `${marker}\n${bullet}`)
              : readme.replace('## Installation', `${bullet}\n\n## Installation`);
          }
          fs.writeFileSync(readmePath, readme);

          const firstPath = 'README-ERST-LESEN.txt';
          fs.writeFileSync(
            firstPath,
            fs.readFileSync(firstPath, 'utf8')
              .replace(/^FishIT KH CHECKER v[^\n]+/u, `FishIT KH CHECKER v${version}`)
          );

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const heading = '## 2.4.2 – Verifizierte PWA-Updates';
          if (!changelog.includes(heading)) {
            const entry = `\n${heading}\n\n- behebt den falschen Updatehinweis nach einem frischen Netzwerkladen oder gelöschtem Cache,\n- ein wartender Service Worker ist nur noch ein Lifecycle-Signal und kein Updatebeweis,\n- der bereitgestellte Build wird mit \`no-store\` gegen den geladenen Build geprüft,\n- ein echter alter Homescreen-Build erhält erst nach vollständig vorbereitetem neuen Worker einen Updatehinweis,\n- \`Jetzt aktualisieren\` aktiviert den verifizierten Worker, lädt den neuen Build und lässt Workbox den alten Precache entfernen,\n- lokale Nutzerdaten und Einstellungen bleiben erhalten.\n`;
            changelog = changelog.replace('# Changelog\n', `# Changelog\n${entry}`);
          }
          fs.writeFileSync(changelogPath, changelog);

          const pwaTestPath = 'src/lib/pwaUpdate.test.ts';
          fs.writeFileSync(
            pwaTestPath,
            fs.readFileSync(pwaTestPath, 'utf8').replaceAll("'2.4.1'", "'2.4.2'")
          );

          fs.writeFileSync('RELEASE-NOTES-v2.4.2.txt', `FishIT KH Checker v2.4.2\n============================\n\nBEHOBEN\n-------\n- Ein frischer Netzwerkladen oder eine Cache-Reparatur wird nicht mehr fälschlich als verfügbares Update angezeigt.\n- Eine wirklich veraltete Homescreen-App erkennt einen neueren Deploy-Build und bietet ihn nach vollständiger Vorbereitung an.\n- „Jetzt aktualisieren“ aktiviert den neuen Worker, lädt den neuen App-Build und ersetzt den alten Workbox-App-Cache.\n- Verlauf, Favoriten, eigene Produkte, Fotos, Einstellungen und Kalibrierungen bleiben erhalten.\n`);
          NODE

      - name: Remove one-off workflow and commit synchronized files
        run: |
          rm .github/workflows/one-off-release-v2-4-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md README-ERST-LESEN.txt CHANGELOG.md RELEASE-NOTES-v2.4.2.txt src/lib/pwaUpdate.test.ts .github/workflows/one-off-release-v2-4-2.yml
          git commit -m "Synchronize release metadata for v2.4.2 [v2.4.2-release-sync]"
          git push origin HEAD:agent/release-pwa-fix-v2-4-2
