name: Smart unit prompts apply

on:
  push:
    branches:
      - agent/smart-unit-prompts

permissions:
  contents: write

concurrency:
  group: smart-unit-prompts-apply
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/smart-unit-prompts
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Apply scoped source transform
        run: node scripts/apply-smart-unit-prompts.mjs

      - name: Commit transformed production files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/useCatalogController.ts src/app/CalculatorScreen.tsx src/app/catalogViewModel.ts src/lib/resolution/catalogResolution.ts src/session.test.ts src/styles.css
          if git diff --cached --quiet; then
            echo "No transform changes to commit."
          else
            git commit -m "implement smart per-product unit prompts"
            git push origin HEAD:agent/smart-unit-prompts
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused unit and catalog sample tests
        run: npx vitest run src/lib/smartUnitPrompt.test.ts src/lib/smartUnitPrompt.catalog.test.ts src/session.test.ts

      - name: Lint touched runtime
        run: npx biome lint src/app/useCatalogController.ts src/app/CalculatorScreen.tsx src/app/queryParser.ts src/app/catalogViewModel.ts src/lib/genericFoods.ts src/lib/smartUnitPrompt.ts src/lib/mealCalculation.ts src/lib/resolution/catalogResolution.ts src/lib/smartUnitPrompt.test.ts src/lib/smartUnitPrompt.catalog.test.ts src/session.test.ts e2e/smart-unit-prompts.spec.ts

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regressions
        run: npx playwright test e2e/smart-unit-prompts.spec.ts --project=chromium-desktop
