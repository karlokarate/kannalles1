name: One-off PR pagination and portion finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/search-pagination-and-portion-semantics-v2-5' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/search-pagination-and-portion-semantics-v2-5
          fetch-depth: 1
          persist-credentials: true

      - name: Apply controller migration and release synchronization
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected one fragment, found {count}')
              return text.replace(before, after, 1)

          # Reuse the exact migration already reviewed in the branch workflow.
          migration_path = root / '.github/workflows/one-off-pagination-portion-migration.yml'
          migration_text = migration_path.read_text()
          marker = "          python3 - <<'PY'\n"
          start = migration_text.index(marker) + len(marker)
          end = migration_text.index('\n          PY\n', start)
          lines = migration_text[start:end].splitlines()
          migration_script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(migration_script, str(migration_path), 'exec'), {'__name__': '__main__'})

          calculator_path = root / 'src/app/CalculatorScreen.tsx'
          calculator = calculator_path.read_text()
          calculator = replace_once(
              calculator,
              "import { catalogProductEligibility } from '../lib/resolution/catalogResolution';\n",
              "import { CATALOG_SEARCH_PAGE_SIZE } from '../lib/catalog/catalogPagination';\nimport { catalogProductEligibility } from '../lib/resolution/catalogResolution';\n",
              'calculator pagination import'
          )
          calculator = replace_once(
              calculator,
              '          <small>Die Produktsuche bleibt vollständig lokal. Per Text oder Sprache kannst du auch mehrere Produkte nennen, z. B. „2 Scheiben Brot mit 20 g Nutella und 400 ml Sprite“.</small>',
              '          <small>Die Produktsuche bleibt vollständig lokal. Mehrere Produkte ohne eigene Einheit werden als Portion verstanden; fehlt eine belastbare Portionsgröße, fragt die App sie produktspezifisch ab. Beispiel: „ein halbes Brötchen mit Nutella“.</small>',
              'compound portion help'
          )
          calculator = replace_once(
              calculator,
              'data-testid="catalog-search-results" data-result-count={c.search.candidates.length} data-order-authority="local-then-sqlite"',
              'data-testid="catalog-search-results" data-result-count={c.search.candidates.length} data-page-size={CATALOG_SEARCH_PAGE_SIZE} data-page-number={c.searchPage + 1} data-order-authority="local-then-sqlite"',
              'pagination data contract'
          )
          calculator = replace_once(
              calculator,
              '<span>{c.search.candidates.length} Treffer</span>',
              '<span>{c.search.candidates.length} Treffer auf dieser Seite</span>',
              'page result label'
          )
          calculator = replace_once(
              calculator,
              '<span className="result-position">{index + 1}</span>',
              '<span className="result-position">{c.searchPage * CATALOG_SEARCH_PAGE_SIZE + index + 1}</span>',
              'global result position'
          )
          calculator = replace_once(
              calculator,
              '<span>Seite {c.searchPage + 1}</span>',
              '<span>Seite {c.searchPage + 1} · {CATALOG_SEARCH_PAGE_SIZE} Treffer pro Seite</span>',
              'page navigation label'
          )
          calculator_path.write_text(calculator)

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          version = '2.5.0'
          package['version'] = version
          semantic_tests = package['scripts']['test:semantic-input']
          for file in [
              'src/app/catalogSearchPagination.test.ts',
              'src/app/queryParser.compoundPortions.test.ts',
              'src/app/compoundPortionResolution.test.ts',
              'scripts/search-pagination-portion.architecture.test.ts'
          ]:
              if file not in semantic_tests:
                  semantic_tests += f' {file}'
          package['scripts']['test:semantic-input'] = semantic_tests
          semantic_e2e = package['scripts']['test:e2e:semantic-input']
          for file in [
              'e2e/search-pagination.spec.ts',
              'e2e/compound-portion-semantics.spec.ts'
          ]:
              if file not in semantic_e2e:
                  semantic_e2e = semantic_e2e.replace(' --project=', f' {file} --project=')
          package['scripts']['test:e2e:semantic-input'] = semantic_e2e
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          lock_path = root / 'package-lock.json'
          lock = json.loads(lock_path.read_text())
          lock['version'] = version
          lock['packages']['']['version'] = version
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          readme_path = root / 'README.md'
          readme = re.sub(
              r'^# FishIT KH Checker v[^\n]+',
              f'# FishIT KH Checker v{version}',
              readme_path.read_text(),
              count=1
          )
          features = [
              '- Katalogsuchen sind nicht auf insgesamt 20 Treffer begrenzt, sondern zeigen fest 20 Treffer pro Seite mit fortlaufender Seitennavigation',
              '- Mehrprodukteingaben ohne eigene Einheit verwenden generisch Portion; fehlende Portionsgrößen werden für jedes betroffene Produkt abgefragt'
          ]
          marker_text = '- Eingabe von Menge und Einheit zusammen mit dem Produktnamen, zum Beispiel `3 Riegel Kinder Bueno`'
          for feature in reversed(features):
              if feature not in readme:
                  readme = readme.replace(marker_text, marker_text + '\n' + feature, 1)
          readme_path.write_text(readme)

          first_path = root / 'README-ERST-LESEN.txt'
          first_path.write_text(re.sub(
              r'^FishIT KH CHECKER v[^\n]+',
              f'FishIT KH CHECKER v{version}',
              first_path.read_text(),
              count=1
          ))

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text()
          heading = '## 2.5.0 – Durchgängige Suchseiten und generische Portionssemantik'
          if heading not in changelog:
              entry = f'''\n{heading}\n\n- breite Katalogsuchen zeigen fest 20 Treffer pro Seite und bleiben über Seite 2, 3 und weitere Seiten vollständig erreichbar,\n- ein einundzwanzigster Treffer wird ausschließlich als Look-ahead verwendet und nie zusätzlich auf der aktuellen Seite angezeigt,\n- die frühere Einstellung „Maximale Suchtreffer“ begrenzt die Ergebnismenge nicht mehr,\n- Mehrprodukteingaben ohne ausdrücklich genannte Einheit werden generisch als Portion interpretiert,\n- `ein halbes Brötchen mit Nutella` bedeutet `0,5 Portion Brötchen` plus `1 Portion Nutella`,\n- fehlt für eines der Produkte eine belastbare Portion, wird die Portionsgröße über den vorhandenen Smart-Unit-Dialog abgefragt,\n- ausdrücklich eingegebene Einheiten wie `15 g Nutella` bleiben unverändert maßgeblich.\n'''
              changelog = changelog.replace('# Changelog\n', '# Changelog\n' + entry, 1)
          changelog_path.write_text(changelog)

          release_path = root / f'RELEASE-NOTES-v{version}.txt'
          release_path.write_text('''FishIT KH Checker v2.5.0\n============================\n\nNEU\n---\n- Suchergebnisse sind nicht mehr auf insgesamt 20 Produkte begrenzt. Jede Seite zeigt exakt bis zu 20 Treffer; weitere Ergebnisse sind über Zurück/Weiter erreichbar.\n- Mehrprodukteingaben ohne eigene Einheit verwenden automatisch eine Portion.\n- Beispiel: „ein halbes Brötchen mit Nutella“ wird als 0,5 Portion Brötchen plus 1 Portion Nutella verarbeitet.\n- Ist für ein Produkt keine belastbare Portion vorhanden, fragt die App die Grammzahl dieser Portion ab und speichert sie produktspezifisch.\n\nVERTRAG\n-------\nExplizit eingegebene Einheiten bleiben maßgeblich. Stück-, Portions- oder Servinggewichte werden niemals geraten.\n''')

          pwa_test_path = root / 'src/lib/pwaUpdate.test.ts'
          pwa_test_path.write_text(
              pwa_test_path.read_text().replace("'2.4.2'", "'2.5.0'")
          )

          validator_path = root / 'scripts/validate-workflow.mjs'
          validator = validator_path.read_text()
          validator = replace_once(
              validator,
              "const naturalLanguage = specs.get('natural-language-quantities.spec.ts');\nconst pwaUpdate = specs.get('pwa-update.spec.ts');",
              "const naturalLanguage = specs.get('natural-language-quantities.spec.ts');\nconst searchPagination = specs.get('search-pagination.spec.ts');\nconst compoundPortions = specs.get('compound-portion-semantics.spec.ts');\nconst pwaUpdate = specs.get('pwa-update.spec.ts');",
              'validator sentinel declarations'
          )
          validator = replace_once(
              validator,
              'if (!matrix || !quality || !catalog || !runtime || !naturalLanguage || !pwaUpdate || !harness || !pwaUpdateConfig || !pwaUpdateServer) {',
              'if (!matrix || !quality || !catalog || !runtime || !naturalLanguage || !searchPagination || !compoundPortions || !pwaUpdate || !harness || !pwaUpdateConfig || !pwaUpdateServer) {',
              'validator sentinel requirement'
          )
          validator = replace_once(
              validator,
              "  ]) requireText(naturalLanguage, fragment, 'Natural-Language-Quantity-E2E-Coverage');\n  for (const fragment of [\n    \"const OLD_BUILD = 'pwa-old'\",",
              "  ]) requireText(naturalLanguage, fragment, 'Natural-Language-Quantity-E2E-Coverage');\n  for (const fragment of [\n    'data-page-size',\n    \"toHaveText('21')\",\n    \"toHaveText('41')\",\n    'Weiter →'\n  ]) requireText(searchPagination, fragment, 'Search-Pagination-E2E-Coverage');\n  for (const fragment of [\n    'ein halbes Brötchen mit Nutella',\n    'pending-unit-size',\n    \"data-unit-kind', 'portion'\",\n    'Wie viel Gramm wiegt eine Portion?'\n  ]) requireText(compoundPortions, fragment, 'Compound-Portion-E2E-Coverage');\n  for (const fragment of [\n    \"const OLD_BUILD = 'pwa-old'\",",
              'validator E2E coverage'
          )
          validator = replace_once(
              validator,
              "    'src/app/catalogInputRequest.test.ts',\n    'src/session.test.ts',\n    'scripts/catalog-input-request.architecture.test.ts'",
              "    'src/app/catalogInputRequest.test.ts',\n    'src/app/catalogSearchPagination.test.ts',\n    'src/app/queryParser.compoundPortions.test.ts',\n    'src/app/compoundPortionResolution.test.ts',\n    'src/session.test.ts',\n    'scripts/catalog-input-request.architecture.test.ts',\n    'scripts/search-pagination-portion.architecture.test.ts'",
              'validator semantic unit tests'
          )
          validator = replace_once(
              validator,
              "    'e2e/natural-language-quantities.spec.ts',\n    'e2e/input-request-ssot.spec.ts',\n    '--project=chromium-desktop'",
              "    'e2e/natural-language-quantities.spec.ts',\n    'e2e/input-request-ssot.spec.ts',\n    'e2e/search-pagination.spec.ts',\n    'e2e/compound-portion-semantics.spec.ts',\n    '--project=chromium-desktop'",
              'validator semantic E2E tests'
          )
          validator_path.write_text(validator)
          PY

      - name: Remove temporary workflows and commit final implementation
        run: |
          rm .github/workflows/one-off-pagination-portion-migration.yml
          rm .github/workflows/one-off-pr-pagination-portion-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v2.5.0 pagination and compound portions [pagination-portion-final]"
          git push origin HEAD:agent/search-pagination-and-portion-semantics-v2-5
