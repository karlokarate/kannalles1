version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - vite-plugin-pwa
          - typescript
          - vitest
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      quality:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
          - "@biomejs/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
